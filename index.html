<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nouhayla Resume | Choose Your Language</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stylesheet.css">
</head>
<body>
    <div class="background-orb orb-one"></div>
    <div class="background-orb orb-two"></div>
    <div class="background-orb orb-three"></div>

    <main class="landing-card" aria-label="Resume language selection">
        <p class="eyebrow">Welcome</p>
        <h1>Nouhayla Mecheboub</h1>
        <p class="intro">
            Data Scientist • Data Analyst<br>
            Select your preferred language to continue.
        </p>

        <div class="buttons" aria-label="Language options">
            <a href="index_en.html" class="language-card english" aria-label="Open English resume">
                <span class="flag">🇺🇸</span>
                <span>
                    <strong>English</strong>
                    <small>View Resume</small>
                </span>
                <span class="arrow">→</span>
            </a>

            <a href="index_fr.html" class="language-card french" aria-label="Open French resume">
                <span class="flag">🇫🇷</span>
                <span>
                    <strong>Français</strong>
                    <small>Voir le CV</small>
                </span>
                <span class="arrow">→</span>
            </a>
        </div>
    </main>
</body>
</html>
